name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - name: coverage gate (internal packages, excluding CLI wiring)
        run: |
          grep -v -e '/internal/cli/' -e '/cmd/' coverage.out > coverage.core.out
          total=$(go tool cover -func=coverage.core.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "core coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 80) }'

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - name: embedded build is up to date
        run: |
          npm run build
          git diff --exit-code -- ../internal/webui/dist || (echo "internal/webui/dist is stale: run 'make web' and commit" && exit 1)
