name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -coverprofile=coverage.out ./...
      - name: coverage gate (internal packages, excluding CLI wiring)
        run: |
          grep -v -e '/internal/cli/' -e '/cmd/' coverage.out > coverage.core.out
          total=$(go tool cover -func=coverage.core.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "core coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 80) }'
